[project]
name = "mira-agent-sdk"
version = "0.2.0"
description = "Governance and verifiable provenance for AI agents — the client for Mira"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Liora AI" }]
keywords = ["ai-agents", "governance", "provenance", "audit", "policy", "in-toto"]

# Deliberately tiny. This lands in other people's agents, so every dependency
# is one we would defend: canonical JSON and Ed25519, nothing else.
dependencies = [
  "mira-agent-core>=0.2,<0.3",
]

[project.optional-dependencies]
http = ["httpx>=0.27"]
otel = ["opentelemetry-sdk>=1.30"]
dev = ["pytest>=8", "httpx>=0.27", "opentelemetry-sdk>=1.30"]

# mira-verify ships with mira-agent-core, so an auditor can install
# the verifier alone without pulling in a client SDK.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mira_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "mira-agent-core"
version = "0.2.0"
description = "Canonical provenance records, Ed25519 signing, Merkle proofs and offline verification for Mira"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Liora AI" }]
keywords = ["provenance", "in-toto", "dsse", "merkle", "transparency-log", "audit"]

# The shared implementation between the SDK and the control plane. Two
# dependencies on purpose: an auditor should be able to read all of it, and it
# is imported by both a server and other people's agents.
dependencies = [
  "rfc8785>=0.1.4",
  "cryptography>=42",
]

[project.scripts]
mira-verify = "mira_agent_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mira_agent_core"]
